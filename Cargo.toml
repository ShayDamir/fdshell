[workspace]
resolver = "2"
members = [
    "safe/fdshell",
    "safe/builtins",
    "unsafe/sys",
]

[workspace.lints.rust]
dead_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
todo = "allow"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
map_err_ignore = "deny"
result_unit_err = "deny"
unused_io_amount = "deny"


# Incremental compilation caches stale MIR bodies for small predicate edits in
# this workspace (task #326 debugging): a rebuilt rlib kept the previous `is_bg`
# body while picking up its edited callees. Disable it — the crates are small.
[profile.dev]
incremental = false
