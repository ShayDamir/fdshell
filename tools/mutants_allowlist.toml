reason = "Task #581, measured on the mapped suite with the mutant applied as source (the lib's `intercept::read` rows, `tests/read.rs` and all of `tests/trap.rs`: green): `poll` answers `EINTR` for a handled signal and no other errno is reachable from this call (`nfds == 1` over a valid slice, so no `EFAULT`; a legal timeout, so no `EINVAL`), so the guard's false arm — the report — has no input that reaches it. The EINTR arm is what the pins kill (`tests/trap.rs::a_signal_during_the_read_poll_restarts_it` and its two neighbours). Re-derive after any change to this line."
