reason = "Task #576, measured on the full suite with the mutant applied as source: every stray-closer row the scan recognizes passes a word whose run is quote-free (keyword_len stops at a break byte), so the quote gate's backward walk answers false at the word's own end and at any misaligned window alike (`None => false`); `pos * skip` shifts the window off the word and the verdict is unchanged. The killable family of this site dies in `error/parse/position/tests.rs`; only the `*` mutants are equivalent. Re-derive after any change to this line."

