mutant: no test in the map's filter can kill it."""

[[allow]]
file = "safe/fdshell/src/brace_expand.rs"
line = 59
column = 28
mutant = "replace > with >= in rebuild"
reason = """Task #549's gate term. The `>=` arm calls `redirect_guard::guard` for operands
that expand to exactly one word, and the guard's own rule is "a worddef subject
expanding to a number of non-empty words other than one is `ambiguous
redirect`": for a one-word expansion it answers `Ok` and the call is a no-op.
The pinned row at the two-word guard start (`the_worddef_guard_starts_at_two_words`
in `brace_expand/tests.rs`) keeps its value under the mutant, and the map
(unit tests and the `brace_expand` binary) is green: no test in the filter can
kill it."""
