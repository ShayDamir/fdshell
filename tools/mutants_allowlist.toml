mutant = "replace | with ^"
reason = "The two operands are distinct single bits (`EXPAND_ALIASES`, `PROMPTVARS`), so their union and their symmetric difference are the same value: no bit belongs to both, which is the only case where `|` and `^` differ. Any test on `DEFAULTS` — `options/tests.rs` reads it through `shopt -q` and the `DEFAULTS` pins — sees the same `u32` under either operator, so no test can observe the mutation; the other operators at this site (`&`, `+`, ...) are killed by the file's pins. Re-derive after any change to this line."
