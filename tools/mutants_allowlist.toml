# is now killed by a named test or gone from `--list`; git keeps the proofs.

[[allow]]
file = "safe/fdshell/src/parse/for_block/arith/region.rs"
line = 52
column = 13
mutant = "replace < with <= in measure"
reason = """Task #549's gate term. The `<=` arm of the scan loop can only fire at
`i == line.len()`, and a scan that reaches the line end already left the loop
with `paren_depth == 0` (the `(` of the arithmetic word closed at or before the
end), so the extra iteration is never entered with `depth > 0`; `advance` at
the end has nothing to consume. The pinned boundary row in
`parse/for_block/arith/tests.rs` keeps its value under the mutant, and the
module suite is green under it: no test in the map's filter can kill it."""

[[allow]]
