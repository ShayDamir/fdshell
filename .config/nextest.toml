experimental = ["wrapper-scripts"]

[profile.default]
slow-timeout = { period = "10s", terminate-after = 1 }

# The `times` children-CPU burn's wall time is its CPU divided by its share of
# the machine, and one slow-timeout kill of ANY test is a false kill of every
# mutant in the copy (LESSONS: "A mutant caught by a flaky test is a false
# kill"). Keep the 10 s "slow" period — the suite bounds itself by it
# (`safe/fdshell/tests/loops.rs::run_bounded` bounds its child at 5 s because
# the kill sits at 10 s; `safe/fdshell/tests/ignoreeof.rs` and
# `safe/fdshell/src/repl/line.rs` size against it) — and widen only the kill
# (10 s -> 40 s), for this one test: 8 concurrent suite runs (the
# `cargo mutants -j8` profile, 32 cores) measured it at 0.33-3.99 s.
[[profile.default.overrides]]
filter = 'test(times_children_total_time_increases_after_wait)'
slow-timeout = { period = "10s", terminate-after = 4 }

# The pinned 100/101 nesting-cap pair is the smallest pair that pins
# `MAX_NESTING = 100`, and its cost is real product CPU (a fork + pipe + reap
# round trip per level), so — unlike a burn — it cannot be shrunk: the kill is
# what moves. Keep the 10 s "slow" period and widen only the kill (10 s -> 40 s)
# for this one test: 32-core host, 0.23-0.35 s quiet (12 runs) and 1.82-7.75 s
# (median 4.68) across 160 runs of the 8-concurrent full-suite harness (the
# `cargo mutants -j8` profile); pre-override it sat at 8.08-8.78 s there and was
# killed at 10.006 s in 2 of 8 runs, so the plain period left a 1.3x margin and
# 40 s leaves >5x.
[[profile.default.overrides]]
filter = 'test(word0_deep_nesting_is_bounded)'
slow-timeout = { period = "10s", terminate-after = 4 }

# The `tests/nest.rs` trio are the smallest rows pinning `MAX_NESTING = 100` for
# a `case`/`while`/`for` body (99 wrapper levels run, 100 refuse), and their cost
# is real parse CPU at that pinned boundary — the levels -> wall curve is
# quadratic (10/25/50/75/99 levels: 0.03/0.12/0.32/0.59/0.87 s, fork-and-exit
# control 0.01 s, `{ …; }` groups at the pinned levels 0.48 s) — so the input
# cannot be shrunk and the kill is what moves. Keep the 10 s "slow" period — the
# suite bounds itself by it — and widen only the kill (10 s -> 40 s), for these
# three tests: quiet 0.59-2.29 s (12 runs each); the plain period killed
# 33/33/31 of 160 harness runs (the 8-concurrent full-suite `cargo mutants -j8`
# profile, 32 cores), whose un-truncated tail runs to 17.29 s (median ~9.0 s, a
# quarter of observations over 10 s), and the 40 s kill saw 0 timeouts in 320 such
# runs — 2.3x over its own observed max, ~1e-8 per observation on that tail.
# Verified the filter fires: period `1ms` kills exactly these three rows.
[[profile.default.overrides]]
filter = 'test(case_body_counts_toward_limit) | test(while_body_counts_toward_limit) | test(for_body_counts_toward_limit)'
slow-timeout = { period = "10s", terminate-after = 4 }

# Cap each test binary at 128MB of virtual address space (RLIMIT_AS).
# Allocation failures abort the test cleanly instead of tripping the host
# OOM killer, which filters out infinite-allocation mutants (e.g. in semi.rs).
[scripts.wrapper.mem-limit]
command = ['prlimit', '--as=134217728', '--']

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'mem-limit'
